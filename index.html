<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080000">
<title>Jebkit</title>
<style>
:root {
    color-scheme: dark;
    --red: #ff2929;
    --deep-red: #720000;
    --panel: rgba(17, 0, 0, .94);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 24px;
    overflow: hidden;
    background: #050000;
    color: #fff;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
}
#matrix {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
}
.vignette {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 15%, rgba(0,0,0,.84) 100%);
}
.panel {
    position: relative;
    isolation: isolate;
    width: min(100%, 500px);
    padding: 46px 30px 34px;
    overflow: hidden;
    text-align: center;
    border: 1px solid rgba(255, 55, 55, .72);
    border-radius: 15px;
    background:
        linear-gradient(145deg, rgba(66,0,0,.97), rgba(9,0,0,.98) 58%, rgba(38,0,0,.97));
    box-shadow: 0 0 38px rgba(255,0,0,.25), inset 0 1px 2px rgba(255,255,255,.2);
}
.panel::before, .dialog::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: 0 0 auto;
    height: 48%;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.13), transparent);
}
h1 {
    margin: 0;
    color: #ff3333;
    font-size: clamp(46px, 12vw, 60px);
    letter-spacing: .16em;
    text-indent: .16em;
    text-shadow: 0 0 10px #f00, 0 0 30px #900;
}
.subtitle {
    margin: 17px 0 34px;
    color: #d65a5a;
    font-size: 12px;
    letter-spacing: .34em;
}
button {
    appearance: none;
    -webkit-appearance: none;
    border: 1px solid #ff6262;
    border-radius: 7px;
    padding: 16px 18px;
    color: #fff;
    font: 700 14px/1.2 inherit;
    font-family: inherit;
    letter-spacing: .12em;
    cursor: pointer;
    background: linear-gradient(180deg, #ff4949 0%, #c90000 48%, #710000 100%);
    box-shadow: 0 4px 0 #410000, 0 0 18px rgba(255,0,0,.25), inset 0 1px 2px rgba(255,255,255,.55);
    transition: filter .18s ease, box-shadow .18s ease, transform .18s ease;
}
button:hover:not(:disabled) {
    filter: brightness(1.18);
    box-shadow: 0 4px 0 #410000, 0 0 25px rgba(255,0,0,.65), inset 0 1px 3px #fff;
}
button:active:not(:disabled) { transform: translateY(2px); }
button:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 4px;
}
button:disabled {
    opacity: .42;
    filter: grayscale(.7);
    cursor: not-allowed;
    box-shadow: none;
}
.launch-button { width: 100%; }
.footer {
    margin-top: 29px;
    color: #a44;
    font-size: 10px;
    letter-spacing: .2em;
}
.overlay {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,.86);
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
}
.overlay.is-open { display: flex; }
.dialog {
    position: relative;
    isolation: isolate;
    width: min(100%, 390px);
    padding: 30px 24px 25px;
    overflow: hidden;
    text-align: center;
    border: 1px solid #f33;
    border-radius: 12px;
    background: linear-gradient(145deg, #390000, #100000 58%, #290000);
    box-shadow: 0 0 42px rgba(255,0,0,.36), inset 0 1px 2px rgba(255,255,255,.2);
    animation: appear .22s ease-out;
}
@keyframes appear {
    from { opacity: 0; transform: scale(.92); }
    to { opacity: 1; transform: scale(1); }
}
.dialog h2 {
    margin: 0 0 18px;
    color: #ff4141;
    font-size: 20px;
    letter-spacing: .16em;
    text-shadow: 0 0 12px #f00;
}
.dialog p {
    position: relative;
    margin: 12px 0;
    color: #ddd;
    font-size: 13px;
    line-height: 1.75;
}
.firmware {
    margin: 20px 0;
    padding: 15px 10px;
    border: 1px solid #a00;
    border-radius: 7px;
    color: #ff3333;
    background: linear-gradient(180deg, #430000, #160000);
    box-shadow: inset 0 1px 2px rgba(255,255,255,.17);
    font-size: 23px;
    font-weight: 700;
    text-shadow: 0 0 12px red;
}
.countdown {
    min-height: 18px;
    margin-top: 18px;
    color: #ff5555;
    font-size: 11px;
    letter-spacing: .12em;
}
.actions {
    display: flex;
    gap: 12px;
    margin-top: 21px;
}
.actions button {
    flex: 1;
    min-width: 0;
    padding: 14px 8px;
    font-size: 12px;
}
.cancel-button {
    border-color: #777;
    background: linear-gradient(180deg, #555, #191919);
    box-shadow: 0 4px 0 #080808, inset 0 1px 2px rgba(255,255,255,.35);
}
.note {
    margin-top: 17px !important;
    color: #b55 !important;
    font-size: 10px !important;
    letter-spacing: .08em;
}
@media (max-width: 380px) {
    body { padding: 15px; }
    .panel { padding: 36px 20px 28px; }
    .dialog { padding: 26px 17px 21px; }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>
<body>
<canvas id="matrix" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<main class="panel">
    <h1>JEBKIT</h1>
    <div class="subtitle">WEBKIT INTERFACE</div>
    <button class="launch-button" id="launchButton" type="button">EXECUTE PAYLOAD</button>
    <div class="footer">JEBKIT</div>
</main>

<div class="overlay" id="firmwarePopup" role="presentation">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogDescription">
        <h2 id="dialogTitle">FIRMWARE CHECK</h2>
        <p id="dialogDescription">
            Before continuing, open <strong>System Settings</strong> on your device
            and check the currently installed system firmware.
        </p>
        <div class="firmware">VERSION 23.0.1</div>
        <p>Please verify the version shown above before continuing.</p>
        <div class="countdown" id="countdown" aria-live="polite">PLEASE WAIT 5 SECONDS</div>
        <div class="actions">
            <button class="cancel-button" id="cancelButton" type="button">CANCEL</button>
            <button id="okButton" type="button" disabled>WAIT 5s</button>
        </div>
        <p class="note">JEBKIT</p>
    </section>
</div>

<script>
(function () {
    "use strict";

    /* Decorative Matrix background */
    var canvas = document.getElementById("matrix");
    var ctx = canvas.getContext("2d");
    var glyphs = "01アイウエオカキクケコ";
    var drops = [];
    var columns = 0;
    var frame = 0;
    var animationId = null;
    var reduceMotion = window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function resizeCanvas() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var width = window.innerWidth;
        var height = window.innerHeight;

        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        columns = Math.ceil(width / 16);
        drops = [];
        for (var i = 0; i < columns; i++) {
            drops.push(Math.random() * -35);
        }
    }

    function drawMatrix() {
        var width = window.innerWidth;
        var height = window.innerHeight;

        ctx.fillStyle = "rgba(5,0,0,0.10)";
        ctx.fillRect(0, 0, width, height);
        ctx.font = "16px monospace";

        for (var i = 0; i < drops.length; i++) {
            var y = drops[i];
            var glyph = glyphs.charAt(Math.floor(Math.random() * glyphs.length));
            ctx.fillStyle = Math.random() > 0.97 ? "#ff7777" : "#e01010";
            ctx.fillText(glyph, i * 16, y * 16);

            if (y * 16 > height && Math.random() > 0.975) {
                drops[i] = 0;
            } else {
                drops[i] += 1;
            }
        }

        if (!reduceMotion) {
            animationId = window.requestAnimationFrame(drawMatrix);
        }
    }

    resizeCanvas();
    if (!reduceMotion) {
        animationId = window.requestAnimationFrame(drawMatrix);
    } else {
        drawMatrix();
    }

    window.addEventListener("resize", resizeCanvas);

    /* Firmware reminder dialog and five-second acknowledgement delay */
    var popup = document.getElementById("firmwarePopup");
    var launchButton = document.getElementById("launchButton");
    var cancelButton = document.getElementById("cancelButton");
    var okButton = document.getElementById("okButton");
    var countdown = document.getElementById("countdown");
    var timer = null;
    var remaining = 5;
    var previousFocus = null;

    function closePopup() {
        if (timer !== null) {
            window.clearInterval(timer);
            timer = null;
        }
        popup.classList.remove("is-open");
        remaining = 5;
        launchButton.focus();
    }

    function openPopup() {
        if (timer !== null) {
            window.clearInterval(timer);
            timer = null;
        }

        previousFocus = document.activeElement;
        remaining = 5;
        okButton.disabled = true;
        okButton.textContent = "WAIT 5s";
        countdown.textContent = "PLEASE WAIT 5 SECONDS";
        popup.classList.add("is-open");
        cancelButton.focus();

        timer = window.setInterval(function () {
            remaining -= 1;

            if (remaining > 0) {
                okButton.textContent = "WAIT " + remaining + "s";
                countdown.textContent = "PLEASE WAIT " + remaining + " SECONDS";
            } else {
                window.clearInterval(timer);
                timer = null;
                remaining = 0;
                okButton.disabled = false;
                okButton.textContent = "OK";
                countdown.textContent = "YOU MAY NOW CONTINUE";
                okButton.focus();
            }
        }, 1000);
    }

    launchButton.addEventListener("click", openPopup);
    cancelButton.addEventListener("click", closePopup);

    okButton.addEventListener("click", function () {
        if (remaining !== 0 || okButton.disabled) return;
        closePopup();
        window.alert("JEBKIT v1.01F LOADED - Coded By Z6KD");
    });

    document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && popup.classList.contains("is-open")) {
            closePopup();
        }
    });

    /* Keep the timer cleared if the page is backgrounded or unloaded. */
    window.addEventListener("pagehide", function () {
        if (timer !== null) {
            window.clearInterval(timer);
            timer = null;
        }
        if (animationId !== null) {
            window.cancelAnimationFrame(animationId);
        }
    });
}());
</script>
</body>
</html>
